  <circle cx="18" cy="15.5" r="4.6" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M18 15.5V12.2" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M18 15.5L20.3 16.6" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="18" cy="15.5" r="1" fill="#FFFFFF"/>
</svg>
